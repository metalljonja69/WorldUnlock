<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldUnlock</title>
  <meta name="theme-color" content="#101820">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
</head>
<body>
  <main class="page">
    <header class="app-header">
      <div>
        <p class="eyebrow">Deine Weltreise</p>
        <h1>WorldUnlock</h1>
      </div>
      <button id="menu-button" class="menu-button" type="button"
        aria-label="Menü öffnen" aria-controls="side-menu" aria-expanded="false">☰</button>
    </header>
    <section class="exploration-panel" aria-label="Erkundung">
      <div class="gps-controls">
        <button id="start-button" type="button">Erkundung starten</button>
        <button id="stop-button" type="button" disabled>Erkundung beenden</button>
      </div>
      <p id="gps-status" role="status">GPS ist nicht aktiv.</p>
    </section>
    <div id="map" aria-label="Interaktive Weltkarte"></div>
  </main>
  <aside id="side-menu" class="side-menu" aria-label="Hauptmenü" aria-hidden="true">
    <div class="side-menu-header">
      <h2>Menü</h2>
      <button id="close-menu-button" class="close-button" type="button"
        aria-label="Menü schließen">×</button>
    </div>
    <section class="menu-section" aria-labelledby="progress-heading">
      <h3 id="progress-heading">Fortschritt &amp; Erfolge</h3>
      <div class="statistics" aria-label="Entdeckungsstatistik">
        <div>
          <strong id="distance-count">0 m</strong>
          <span>Zurückgelegte Distanz</span>
        </div>
      </div>
    </section>
    <section class="menu-section country-section" aria-labelledby="countries-heading">
      <h3 id="countries-heading">Besuchte Länder</h3>
      <p id="countries-empty">Noch kein Land besucht.</p>
      <label for="country-select">Land auswählen</label>
      <select id="country-select" disabled>
        <option value="">Noch kein Land verfügbar</option>
      </select>
      <p id="country-progress" class="country-progress">0 % freigeschaltet</p>
    </section>
    <section class="menu-section future-section" aria-labelledby="future-heading">
      <h3 id="future-heading">Weitere Menüs</h3>
      <p>Hier können später neue Bereiche wie Einstellungen und Reiseziele ergänzt werden.</p>
    </section>
    <section class="menu-section" aria-labelledby="data-heading">
      <h3 id="data-heading">Daten</h3>
      <button id="clear-data-button" class="danger-button" type="button">
        Alle gespeicherten Daten löschen
      </button>
    </section>
  </aside>
  <div id="menu-backdrop" class="menu-backdrop" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
